services:
  - type: web
    name: sham-preview
    runtime: static
    buildCommand: echo "Static preview checked into site/"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: rewrite
        source: /404
        destination: /404.html
