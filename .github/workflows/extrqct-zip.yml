# This is a basic workflow to help you get started with Actions

name: Extract Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("website-preview-source-1.zip")

          if not archive.is_file():
              raise SystemExit("ZIP file not found")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise ValueError("Unsafe ZIP path")
                  if (item.external_attr >> 16) & 0o170000 == 0o120000:
                      raise ValueError("Symlink not allowed")
              z.extractall(".")

          print("Extraction completed")
          PY

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git rm --cached --ignore-unmatch website-preview-source.zip

          if ! git diff --cached --quiet; then
            git commit -m "Extract website source"
            git push
            
          fi
