# This is a basic workflow to help you get started with Actions

name: Extract Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP safely
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("website-preview-source.zip")

          if not archive.is_file():
              raise SystemExit("ZIP file not found")

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = Path(item.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise ValueError("Unsafe ZIP path")
                  if (item.external_attr >> 16) & 0o170000 == 0o120000:
                      raise ValueError("Symlink not allowed")
              z.extractall(".")

          print("Extraction completed")
          PY

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git rm --cached --ignore-unmatch website-preview-source.zip

          if ! git diff --cached --quiet; then
            git commit -m "Extract website source"
            git push
            
          fi
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
